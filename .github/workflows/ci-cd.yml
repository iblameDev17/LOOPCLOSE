name: CI-CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        env:
          APP_ENV: test
          LLM_PROVIDER: fake
          DATABASE_URL: sqlite:///./test.db
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: loopclose:ci
          build-args: |
            RENDER_GIT_COMMIT=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [gitleaks, codeql, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "RENDER_DEPLOY_HOOK_URL secret missing"; exit 1; }
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered for ${{ github.sha }}"
      - name: Smoke test (wait for new commit)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "APP_URL secret missing"; exit 1; }
          echo "Expected commit SHA: ${{ github.sha }}"
          echo "Smoke test target: $APP_URL/health"
          for i in $(seq 1 36); do
            # Fetch response body and HTTP status code using curl -sSL --max-time 30
            http_code=$(curl -sSL -o /tmp/health_resp.txt -w "%{http_code}" --max-time 30 "$APP_URL/health" || echo "000")
            body=$(cat /tmp/health_resp.txt 2>/dev/null || echo "")
            body_preview=$(echo "$body" | head -c 200 | tr -d '\n\r')
            commit=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            db_status=$(echo "$body" | jq -r '.db // empty' 2>/dev/null || true)

            echo "attempt $i: http_code=$http_code commit=${commit:-none} body_preview=[$body_preview]"

            if [ "$commit" = "${{ github.sha }}" ]; then
              echo "Deployment verified: commit matches ${{ github.sha }}"
              exit 0
            fi

            if [ "$http_code" = "200" ] && [ "$db_status" = "ok" ] && [ -z "$commit" ]; then
              echo "WARNING: /health returned HTTP 200 with db: ok, but commit is null/missing."
            fi

            sleep 10
          done
          echo "Deployment not confirmed in time after 36 attempts (360s)."
          exit 1

