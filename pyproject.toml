[project]
name = "loopclose"
version = "0.1.0"
description = "AI-powered meeting and handover tracker"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F = pycodestyle + pyflakes; I = isort; B = flake8-bugbear; UP = pyupgrade; S = bandit
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess (not used, but kept for seed scripts)
    "S607",  # subprocess path
    "B008",  # function calls in default arguments (FastAPI Depends pattern)
    "E501",  # line-too-long handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
